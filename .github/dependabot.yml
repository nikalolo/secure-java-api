version: 2

updates:
  # 13 uses of 4 actions, all pinned by sha. minor and patch bumps share one pr;
  # a major changes behaviour, so each one arrives alone.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Tbilisi
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    commit-message:
      prefix: ci

  - package-ecosystem: maven
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Tbilisi
    cooldown:
      default-days: 7
    ignore:
      # a new major of spring boot or maven is a migration, not an update pr.
      - dependency-name: "org.springframework.boot:*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "org.apache.maven:apache-maven"
        update-types: ["version-update:semver-major"]
    commit-message:
      prefix: build

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Tbilisi
    cooldown:
      default-days: 7
    ignore:
      # the baseline image is the "before" evidence and must not move.
      - dependency-name: openjdk
      # the app targets java 17; a new major is a decision, not an update.
      - dependency-name: eclipse-temurin
        update-types: ["version-update:semver-major"]
      # tags read as maven major.minor plus jdk (3.9-eclipse-temurin-26 is "3.9.26"), so
      # semver-major can't hold the jdk. block every tag above the current one;
      # the current tag can still get digest refreshes. maven moves are manual:
      # raise the bound with each move (3.11-eclipse-temurin-17 -> ">= 3.11.17.1").
      - dependency-name: maven
        versions: [">= 3.10.17.1"]
    groups:
      base-images:
        patterns: ["*"]
    commit-message:
      prefix: build

  # tests/requirements.txt is compiled by uv with hashes; the uv updater recompiles it.
  - package-ecosystem: uv
    directory: /tests
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Tbilisi
    cooldown:
      default-days: 7
    groups:
      test-tools:
        patterns: ["*"]
    commit-message:
      prefix: build
