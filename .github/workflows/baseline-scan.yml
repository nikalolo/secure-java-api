name: Baseline image scan

# Run on every push to main, and manually from the Actions tab.
on:
  push:
    branches: [main]
  workflow_dispatch:

# Least privilege: this job only needs to read the repo.
# (Phase 4 covers why the default token permissions are too broad.)
permissions: {}

# a new push to a pull request cancels its older run. runs on main get
# their own group each, so pushes, schedules and dispatches always finish.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  build-and-scan:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      IMAGE: secure-java-api:baseline
      # same digest as scripts/code-scan.sh; not updated by dependabot
      TRIVY_IMAGE: aquasec/trivy:0.76.2@sha256:8f6bb947dbc528902e11f2f5be52f7b519f6a39d5d148f41166f2040499768fb
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # the token stays out of .git/config
          persist-credentials: false

      - name: Set up Java 17
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      # Builds retry once: Maven Central sometimes answers 429.
      # The Maven retry uses -U: Maven caches the failed lookup and would not ask again.
      - name: Build JAR
        run: |
          update=()
          for attempt in 1 2; do
            ./mvnw -B -ntp "${update[@]}" package -DskipTests && exit 0
            if [ "$attempt" = 1 ]; then
              echo "::warning title=Retry::Maven build failed, retrying in 60 s with -U"
              sleep 60
              update=(-U)
            fi
          done
          exit 1

      - name: Build Docker image
        run: |
          for attempt in 1 2; do
            docker build -t "$IMAGE" . && exit 0
            if [ "$attempt" = 1 ]; then
              echo "::warning title=Retry::image build failed, retrying in 60 s"
              sleep 60
            fi
          done
          exit 1

      - name: Smoke test /health
        run: |
          docker run -d --name app -p 8080:8080 "$IMAGE"
          for _ in $(seq 1 30); do
            curl -fsS http://localhost:8080/health && exit 0
            sleep 2
          done
          docker logs app
          exit 1

      - name: Which user does the container run as?
        run: docker exec app id

      # Trivy runs from its own container and reads our image through the
      # Docker socket. The image is pinned by digest: a tag can be moved.
      - name: Trivy scan (table, all severities)
        run: |
          # Create the output dir as the runner user first; otherwise Docker
          # creates it as root and the runner can't write files into it.
          mkdir -p trivy-out
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "$PWD/trivy-out:/out" \
            "$TRIVY_IMAGE" image \
              --format json --output /out/baseline.json \
              --exit-code 0 "$IMAGE"
          docker run --rm \
            -v "$PWD/trivy-out:/out" \
            "$TRIVY_IMAGE" convert \
              --format table /out/baseline.json | tee trivy-out/baseline.txt

      - name: Severity counts to job summary
        run: |
          {
            python3 scripts/trivy_report.py baseline=trivy-out/baseline.json --top 15
            echo
            echo "Image size: $(docker image inspect "$IMAGE" --format '{{.Size}}' | numfmt --to=iec)"
            echo "Container user: $(docker exec app id)"
          } | tee trivy-out/summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload scan results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: trivy-baseline
          path: trivy-out/
