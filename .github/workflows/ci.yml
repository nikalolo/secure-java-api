name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  java-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      # "verify" compiles, runs the JUnit tests and packages the JAR.
      - name: Build and test
        run: mvn -B -ntp verify

  script-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      # Pinned so a new pytest release can't change results unexpectedly.
      - name: Install pytest
        run: python -m pip install pytest==9.2.0
      - name: Test scripts/
        run: python -m pytest -q tests
