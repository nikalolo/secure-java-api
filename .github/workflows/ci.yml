name: CI

on:
  push:
    branches: [main]
  pull_request:

# no token rights by default; each job asks for what it needs
permissions: {}

# a new push to a pull request cancels its older run. runs on main get
# their own group each, so pushes, schedules and dispatches always finish.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  java-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # the token stays out of .git/config
          persist-credentials: false
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      # "verify" compiles, runs the JUnit tests and packages the JAR.
      - name: Build and test
        run: ./mvnw -B -ntp verify

  script-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # the token stays out of .git/config
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      # Every package is pinned by hash, wheels only (no setup.py runs).
      - name: Install pytest
        run: |
          python -m pip install --require-hashes --only-binary :all: -r tests/requirements.txt
      - name: Test scripts/
        run: python -m pytest -q tests
