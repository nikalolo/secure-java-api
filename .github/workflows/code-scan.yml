name: Code scan

# scan: Semgrep + Trivy (pom.xml, app.jar, secrets) via scripts/code-scan.sh.
# secrets: gitleaks over the full git history via scripts/history-scan.sh.
# Gates: exit 10 = a security gate failed (do not rerun to get past it);
# any other failure is a tool or network error and may be rerun.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        # explicit bash adds pipefail; the default "bash -e" has none
        shell: bash
    steps:
      # scanner containers can read .git/config, so leave no token there
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # the semgrep gate compares against a base commit
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      # builds target/app.jar and fills ~/.m2, which trivy fs reads offline
      - name: Build JAR
        run: ./mvnw -B -ntp package -DskipTests

      - name: Run code scan
        env:
          # push: the previous main; pr: the script uses the merge commit's first parent
          GATE_BASE: ${{ github.event_name == 'push' && github.event.before || '' }}
        run: |
          mkdir -p scan-out
          scripts/code-scan.sh 2>&1 | tee scan-out/code-scan.log

      # proves the script's linux --user branch ran
      - name: Assert scan output is not root-owned
        run: |
          other="$(find scan-out ! -user "$(id -u)")"
          if [ -n "$other" ]; then
            echo "not owned by the runner user:"; echo "$other"; exit 1
          fi

      - name: Results to job summary
        if: always()
        run: |
          {
            echo "## Code scan log"
            echo
            echo "~~~~"
            cat scan-out/code-scan.log 2>/dev/null || echo "no log"
            echo "~~~~"
            if [ -f scan-out/trivy-compare.md ]; then
              echo
              cat scan-out/trivy-compare.md
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: code-scan
          path: scan-out/

  # full git history through gitleaks (scripts/history-scan.sh), after a
  # positive control. exit 10 = a leak; other failures are tool errors.
  secrets:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # every commit is scanned; the script refuses a shallow clone
          fetch-depth: 0

      - name: Scan git history for secrets
        env:
          # red test: the trailing space breaks git inside gitleaks (tool error, exit 1). never merge
          LOG_OPTS: "--all "
        run: |
          mkdir -p scan-out/history
          scripts/history-scan.sh 2>&1 | tee scan-out/history-scan.log

      - name: Results to job summary
        if: always()
        run: |
          {
            echo "## Secret scan log"
            echo
            echo "~~~~"
            cat scan-out/history-scan.log 2>/dev/null || echo "no log"
            echo "~~~~"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: history-scan
          path: |
            scan-out/history-scan.log
            scan-out/history/
