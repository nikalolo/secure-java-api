name: Code scan

# Semgrep + Trivy (pom.xml, app.jar, secrets) via scripts/code-scan.sh.
# Report-only: findings never fail the job; tool errors and canaries do.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        # explicit bash adds pipefail; the default "bash -e" has none
        shell: bash
    steps:
      # scanner containers can read .git/config, so leave no token there
      - name: Check out code
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      # builds target/app.jar and fills ~/.m2, which trivy fs reads offline
      - name: Build JAR
        run: ./mvnw -B -ntp package -DskipTests

      - name: Run code scan
        run: |
          mkdir -p scan-out
          scripts/code-scan.sh 2>&1 | tee scan-out/code-scan.log

      # proves the script's linux --user branch ran
      - name: Assert scan output is not root-owned
        run: |
          other="$(find scan-out ! -user "$(id -u)")"
          if [ -n "$other" ]; then
            echo "not owned by the runner user:"; echo "$other"; exit 1
          fi

      - name: Results to job summary
        if: always()
        run: |
          {
            echo "## Code scan log"
            echo
            echo "~~~~"
            cat scan-out/code-scan.log 2>/dev/null || echo "no log"
            echo "~~~~"
            if [ -f scan-out/trivy-compare.md ]; then
              echo
              cat scan-out/trivy-compare.md
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: code-scan
          path: scan-out/
