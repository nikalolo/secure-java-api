name: DAST

# Builds the hardened image from this commit and runs it next to OWASP ZAP on
# an internal docker network with no way out (scripts/dast-scan.sh).
# Gate: wrong status codes, missing security headers or ZAP alerts Low and up
# that .zap/accepted-risks does not cover fail with exit 10 (do not rerun to
# get past it); any other failure is a tool or network error.
on:
  push:
    branches: [main]
  # no paths filter: a required check skipped by a filter would never report
  pull_request:
  workflow_dispatch:

# no token rights by default; each job asks for what it needs
permissions: {}

# a new push to a pull request cancels its older run. runs on main get
# their own group each, so pushes and dispatches always finish.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  dast:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    defaults:
      run:
        # explicit bash adds pipefail; the default "bash -e" has none
        shell: bash
    env:
      IMAGE: secure-java-api:dast
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # the token stays out of .git/config
          persist-credentials: false

      # The hardened Dockerfile builds the JAR itself (multi-stage).
      # Retries once: Maven Central sometimes answers 429.
      - name: Build hardened image
        run: |
          for attempt in 1 2; do
            docker build -t "$IMAGE" -f Dockerfile.hardened . && exit 0
            if [ "$attempt" = 1 ]; then
              echo "::warning title=Retry::hardened image build failed, retrying in 60 s"
              sleep 60
            fi
          done
          exit 1

      # zap runs as the runner user, so a report in scan-out/dast also proves
      # the --user branch: zap as uid 1000 could not write the runner's dir
      - name: DAST scan
        run: |
          mkdir -p scan-out/dast
          scripts/dast-scan.sh "$IMAGE" 2>&1 | tee scan-out/dast/run.log

      - name: Results to job summary
        if: always()
        run: |
          {
            echo "## DAST (OWASP ZAP)"
            echo
            if [ -f scan-out/dast/summary.md ]; then
              cat scan-out/dast/summary.md
            else
              echo "No results: the scan stopped before them (see the DAST scan step log)."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dast
          path: scan-out/dast/
