name: Hardened image scan

# Builds the baseline and hardened images side by side, proves the hardened
# one works under a locked-down runtime, and compares their Trivy results.
# Gate: the hardened image fails on fixable CRITICAL findings (exit 10, do not
# rerun to get past it); any other failure is a tool or network error.
on:
  push:
    branches: [main]
  # no paths filter: a required check skipped by a filter would never report
  pull_request:
  # new CVEs appear without any commit; check main every day
  schedule:
    - cron: "37 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compare:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        # explicit bash adds pipefail; the default "bash -e" has none
        shell: bash
    env:
      BASELINE: secure-java-api:baseline
      HARDENED: secure-java-api:hardened
      # same digest as scripts/code-scan.sh; not updated by dependabot
      TRIVY_IMAGE: aquasec/trivy:0.76.2@sha256:8f6bb947dbc528902e11f2f5be52f7b519f6a39d5d148f41166f2040499768fb
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Java 17
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      # The baseline Dockerfile copies a JAR built on the runner.
      # Builds retry once: Maven Central sometimes answers 429.
      - name: Build JAR for baseline image
        run: |
          for attempt in 1 2; do
            ./mvnw -B -ntp package -DskipTests && exit 0
            if [ "$attempt" = 1 ]; then
              echo "::warning title=Retry::Maven build failed, retrying in 60 s"
              sleep 60
            fi
          done
          exit 1

      - name: Build baseline image
        run: |
          for attempt in 1 2; do
            docker build -t "$BASELINE" -f Dockerfile . && exit 0
            if [ "$attempt" = 1 ]; then
              echo "::warning title=Retry::baseline image build failed, retrying in 60 s"
              sleep 60
            fi
          done
          exit 1

      # The hardened Dockerfile builds the JAR itself (multi-stage).
      - name: Build hardened image
        run: |
          for attempt in 1 2; do
            docker build -t "$HARDENED" -f Dockerfile.hardened . && exit 0
            if [ "$attempt" = 1 ]; then
              echo "::warning title=Retry::hardened image build failed, retrying in 60 s"
              sleep 60
            fi
          done
          exit 1

      # Runtime hardening: read-only root FS, no Linux capabilities, no
      # privilege escalation, resource limits. Only /tmp is writable
      # (Tomcat needs it) and nothing there can be executed.
      - name: Run hardened container with locked-down runtime
        run: |
          docker run -d --name app -p 8080:8080 \
            --read-only \
            --tmpfs /tmp:rw,noexec,nosuid,size=64m \
            --cap-drop ALL \
            --security-opt no-new-privileges:true \
            --memory 512m --pids-limit 200 \
            "$HARDENED"
          for _ in $(seq 1 30); do
            curl -fsS http://localhost:8080/health && exit 0
            sleep 2
          done
          docker logs app
          exit 1

      - name: Assert hardened container does not run as root
        run: |
          uid="$(docker exec app id -u)"
          echo "Container UID: $uid"
          test "$uid" != "0"

      - name: Assert root filesystem is read-only
        run: |
          test "$(docker inspect --format '{{.HostConfig.ReadonlyRootfs}}' app)" = "true"
          # Try as root: root owns /, so only a read-only filesystem can stop
          # this write. (As the app user it would fail on permissions alone,
          # which would not prove anything about the filesystem.)
          if docker exec -u 0 app touch /pwned 2>/dev/null; then
            echo "Root filesystem is writable"; exit 1
          fi
          echo "Write to / as root correctly refused"

      # Both databases are fetched here, with retries, so the scans and the
      # gate below never need the network.
      - name: Download Trivy databases
        run: |
          for db in --download-db-only --download-java-db-only; do
            for attempt in 1 2 3; do
              docker run --rm -v trivy-cache:/root/.cache/trivy \
                "$TRIVY_IMAGE" image --disable-telemetry --quiet "$db" && break
              if [ "$attempt" = 3 ]; then
                echo "::error title=Trivy DB::$db failed 3 times"
                exit 1
              fi
              echo "::warning title=Retry::trivy $db failed, retrying in $((attempt * 30)) s"
              sleep $((attempt * 30))
            done
          done

      - name: Trivy scan both images
        run: |
          mkdir -p trivy-out
          for name in baseline hardened; do
            image="secure-java-api:$name"
            # the package list lets the gate prove it saw the app's jars
            extra=()
            if [ "$name" = hardened ]; then extra=(--list-all-pkgs); fi
            docker run --rm \
              -v /var/run/docker.sock:/var/run/docker.sock \
              -v "$PWD/trivy-out:/out" \
              -v trivy-cache:/root/.cache/trivy \
              "$TRIVY_IMAGE" image \
                --skip-db-update --skip-java-db-update --disable-telemetry \
                "${extra[@]}" \
                --format json --output "/out/$name.json" \
                --exit-code 0 "$image"
          done

      - name: Comparison to job summary
        run: |
          {
            python3 scripts/trivy_report.py \
              baseline=trivy-out/baseline.json \
              hardened=trivy-out/hardened.json --top 10
            echo
            echo "## Image size"
            echo
            echo "| Image | Size |"
            echo "|---|---|"
            for image in "$BASELINE" "$HARDENED"; do
              echo "| $image | $(docker image inspect "$image" --format '{{.Size}}' | numfmt --to=iec) |"
            done
          } | tee trivy-out/comparison.md >> "$GITHUB_STEP_SUMMARY"

      # Only the hardened image is gated; the baseline image is the "before"
      # evidence and stays report-only.
      - name: Hardened image gate (fixable CRITICAL)
        run: scripts/image-gate.sh "$HARDENED" trivy-out/hardened.json

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: trivy-comparison
          path: trivy-out/
