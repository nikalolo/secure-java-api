name: Hardened image scan

# Builds the baseline and hardened images side by side, proves the hardened
# one works under a locked-down runtime, and compares their Trivy results.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compare:
    runs-on: ubuntu-latest
    env:
      BASELINE: secure-java-api:baseline
      HARDENED: secure-java-api:hardened
    steps:
      - name: Check out code
        uses: actions/checkout@v5

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      # The baseline Dockerfile copies a JAR built on the runner.
      - name: Build JAR for baseline image
        run: mvn -B -ntp package -DskipTests

      - name: Build baseline image
        run: docker build -t "$BASELINE" -f Dockerfile .

      # The hardened Dockerfile builds the JAR itself (multi-stage).
      - name: Build hardened image
        run: docker build -t "$HARDENED" -f Dockerfile.hardened .

      # Runtime hardening: read-only root FS, no Linux capabilities, no
      # privilege escalation, resource limits. Only /tmp is writable
      # (Tomcat needs it) and nothing there can be executed.
      - name: Run hardened container with locked-down runtime
        run: |
          docker run -d --name app -p 8080:8080 \
            --read-only \
            --tmpfs /tmp:rw,noexec,nosuid,size=64m \
            --cap-drop ALL \
            --security-opt no-new-privileges:true \
            --memory 512m --pids-limit 200 \
            "$HARDENED"
          for _ in $(seq 1 30); do
            curl -fsS http://localhost:8080/health && exit 0
            sleep 2
          done
          docker logs app
          exit 1

      - name: Assert hardened container does not run as root
        run: |
          uid="$(docker exec app id -u)"
          echo "Container UID: $uid"
          test "$uid" != "0"

      - name: Assert root filesystem is read-only
        run: |
          test "$(docker inspect --format '{{.HostConfig.ReadonlyRootfs}}' app)" = "true"
          # Try as root: root owns /, so only a read-only filesystem can stop
          # this write. (As the app user it would fail on permissions alone,
          # which would not prove anything about the filesystem.)
          if docker exec -u 0 app touch /pwned 2>/dev/null; then
            echo "Root filesystem is writable"; exit 1
          fi
          echo "Write to / as root correctly refused"

      # Known shortcut: ":latest" is not pinned (Phase 4).
      - name: Trivy scan both images
        run: |
          mkdir -p trivy-out
          for name in baseline hardened; do
            image="secure-java-api:$name"
            docker run --rm \
              -v /var/run/docker.sock:/var/run/docker.sock \
              -v "$PWD/trivy-out:/out" \
              -v trivy-cache:/root/.cache/trivy \
              aquasec/trivy:latest image \
                --format json --output "/out/$name.json" \
                --exit-code 0 "$image"
          done

      - name: Comparison to job summary
        run: |
          {
            python3 scripts/trivy_report.py \
              baseline=trivy-out/baseline.json \
              hardened=trivy-out/hardened.json --top 10
            echo
            echo "## Image size"
            echo
            echo "| Image | Size |"
            echo "|---|---|"
            for image in "$BASELINE" "$HARDENED"; do
              echo "| $image | $(docker image inspect "$image" --format '{{.Size}}' | numfmt --to=iec) |"
            done
          } | tee trivy-out/comparison.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-comparison
          path: trivy-out/
