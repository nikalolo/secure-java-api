name: Workflow lint

# workflow-lint: actionlint + zizmor over .github/ via scripts/workflow-lint.sh.
# Gate: exit 10 = a lint finding (fix it, do not rerun to get past it);
# any other failure is a tool or network error and may be rerun.
on:
  push:
    branches: [main]
  # no paths filter: a required check skipped by a filter would never report
  pull_request:
  workflow_dispatch:

# no token rights by default; each job asks for what it needs
permissions: {}

# a new push to a pull request cancels its older run. runs on main get
# their own group each, so pushes, schedules and dispatches always finish.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  workflow-lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    defaults:
      run:
        # explicit bash adds pipefail; the default "bash -e" has none
        shell: bash
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # the token stays out of .git/config
          persist-credentials: false

      - name: Lint workflows
        env:
          # read-only job token: zizmor runs online (impostor commits,
          # known-vulnerable actions)
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p scan-out/lint
          scripts/workflow-lint.sh 2>&1 | tee scan-out/lint/workflow-lint.log

      - name: Results to job summary
        if: always()
        run: |
          {
            echo "## Workflow lint log"
            echo
            echo "~~~~"
            cat scan-out/lint/workflow-lint.log 2>/dev/null || echo "no log"
            echo "~~~~"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: workflow-lint
          path: scan-out/lint/
