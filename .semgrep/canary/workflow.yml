# scan canary, never run: must trigger docker-image-without-digest (custom)
# and curl-eval (p/github-actions only)
jobs:
  canary:
    runs-on: ubuntu-24.04
    steps:
      - run: docker run --rm example/scanner:1.0 --version
      - run: |
          SCRIPT=$(curl -fsS https://example.invalid/install.sh)
          eval "$SCRIPT"
