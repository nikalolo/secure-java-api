spring.application.name=secure-java-api
server.port=8080
# no user store: without this, startup logs a generated password nobody needs
spring.autoconfigure.exclude=org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration
# red test for the dast gate, never merge: tomcat sends this as the Server
# header and zap rule 10036 flags the version
server.server-header=Apache/2.4.1
